<script>
  /* mobile menu */
  (function () {
    var btn = document.querySelector('.nav-toggle'), menu = document.getElementById('navLinks');
    if (!btn || !menu) return;
    function set(open) { menu.classList.toggle('open', open); btn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
    btn.addEventListener('click', function (e) { e.stopPropagation(); set(!menu.classList.contains('open')); });
    menu.addEventListener('click', function (e) { if (e.target.closest('a')) set(false); });
    document.addEventListener('click', function (e) { if (!menu.contains(e.target) && !btn.contains(e.target)) set(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
    var mq = window.matchMedia('(min-width: 801px)');
    if (mq.addEventListener) mq.addEventListener('change', function (m) { if (m.matches) set(false); });
  })();
</script>
